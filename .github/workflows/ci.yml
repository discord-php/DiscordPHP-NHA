name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, zlib
          coverage: none

      # composer.json wires ../DiscordPHP and ../DiscordPHP-Http as path repos
      # (dev-master). Clone them alongside the checkout so resolution matches
      # local dev instead of falling through to Packagist.
      - name: Fetch sibling libraries
        run: |
          git clone --depth 1 https://github.com/discord-php/DiscordPHP.git ../DiscordPHP
          git clone --depth 1 https://github.com/discord-php/DiscordPHP-Http.git ../DiscordPHP-Http

      - name: Install dependencies
        run: COMPOSER_ROOT_VERSION=dev-main composer install --no-interaction --prefer-dist --no-progress

      - name: Lint (php -l)
        run: |
          find src tests bot.php autoplay.php play_nha.php -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: PHPUnit
        run: composer unit

      - name: Code style (php-cs-fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
